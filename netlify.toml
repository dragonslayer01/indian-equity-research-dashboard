[build]
  command = "PYTHONPATH=src python3 scripts/build_dashboard.py --data-dir data --src-dir src/dashboard --out dist/index.html"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
