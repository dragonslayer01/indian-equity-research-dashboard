name: Weekly price refresh

on:
  schedule:
    # Saturday 02:30 UTC ≈ 08:00 IST — after the week’s NSE sessions settle
    - cron: "30 2 * * 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-price-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch and merge market prices
        run: |
          PYTHONPATH=src python scripts/fetch_market_data.py \
            --data-dir data \
            --raw-dir data/raw

      - name: Compute quantitative overlays
        run: |
          PYTHONPATH=src python scripts/compute_quant_signals.py --data-dir data

      - name: Commit and push data updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Prices + price-derived quant overlays (not authored research theses/KPIs).
          git add \
            data/meta.json \
            data/sources.json \
            data/companies.json \
            data/sectors.json \
            data/new_age.json \
            data/quant_signals.json
          if git diff --staged --quiet; then
            echo "No price/quant data changes to commit."
            exit 0
          fi
          PRICE_DATE=$(python3 -c "import json; print(json.load(open('data/meta.json'))['price_date'])")
          git commit -m "Weekly price refresh + quant signals (${PRICE_DATE})."
          git push
